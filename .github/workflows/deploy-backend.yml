name: deploy-backend

# Деплой по тегу: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег для (пере)деплоя, например v0.1.0"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/astana-hub-robot-api:${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: image
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS не задан — доверяю ключу хоста при первом подключении"
            ssh-keyscan -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Pull & restart on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          IMAGE: ${{ needs.image.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ vars.APP_DIR || '/opt/astana-hub-robot' }}
        run: |
          # Токен передаётся через stdin (не попадает в argv на сервере);
          # GITHUB_TOKEN живёт только на время джобы, в конце logout.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy "${SSH_USER}@${SSH_HOST}" \
            "set -e
             docker login ghcr.io -u '${GHCR_USER}' --password-stdin
             trap 'docker logout ghcr.io >/dev/null' EXIT
             cd '${APP_DIR}'
             git fetch --tags --force origin
             git checkout --force 'refs/tags/${TAG}'
             bash infra/scripts/server-update.sh '${TAG}' '${IMAGE}'"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_deploy
