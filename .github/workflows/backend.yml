name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres 16 + pgvector — тот же образ, что в infra/docker-compose.yml.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U hub -d hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then uv sync --locked --all-extras --dev; else uv sync --all-extras --dev; fi

      - name: Ruff lint
        run: uvx ruff check --output-format=github .

      - name: Ruff format
        run: uvx ruff format --check .

      - name: Pytest
        env:
          # Тесты не должны ходить во внешние LLM: ключи пустые.
          DATABASE_URL: sqlite:///./test.db
          # Postgres-тесты (миграции, pgvector); без переменной они пропускаются.
          TEST_POSTGRES_URL: postgresql+psycopg://hub:hub@localhost:5432/hub_test
          ROBOT_TOKEN: test-token
        # exit 5 = тесты не найдены (пока backend пустой) — не падаем.
        run: uv run pytest -q || [ $? -eq 5 ]

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
