name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then uv sync --locked --all-extras --dev; else uv sync --all-extras --dev; fi

      - name: Ruff lint
        run: uvx ruff check --output-format=github .

      - name: Ruff format
        run: uvx ruff format --check .

      - name: Pytest
        env:
          # Тесты не должны ходить во внешние LLM: ключи пустые.
          DATABASE_URL: sqlite:///./test.db
          ROBOT_TOKEN: test-token
        # exit 5 = тесты не найдены (пока backend пустой) — не падаем.
        run: uv run pytest -q || [ $? -eq 5 ]

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
