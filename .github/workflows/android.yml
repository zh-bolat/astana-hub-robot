name: android

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Без явного списка пакетов экшен ставит устаревший пакет «tools», которого больше нет в SDK, и падает.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Если wrapper (gradlew) ещё не закоммичен — ставим ту же версию Gradle.
          gradle-version: ${{ hashFiles('android-app/gradlew') == '' && '8.14.3' || '' }}

      # secrets.properties из GitHub Secrets. Секретов нет (форки, первые запуски) —
      # пустые значения: сборка проходит, в BuildConfig пустые строки.
      - name: Generate secrets.properties
        env:
          AGENT_APP_ID: ${{ secrets.AGENT_APP_ID }}
          ROBOT_TOKEN: ${{ secrets.ROBOT_TOKEN }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          umask 077
          {
            echo "AGENT_APP_ID=${AGENT_APP_ID}"
            echo "ROBOT_TOKEN=${ROBOT_TOKEN}"
            echo "BACKEND_URL=${BACKEND_URL}"
          } > secrets.properties

      - name: Build emulatorDebug + robotosDebug + robotDebug
        run: |
          if [ -x ./gradlew ]; then GRADLE=./gradlew; else GRADLE=gradle; fi
          $GRADLE --no-daemon assembleEmulatorDebug assembleRobotosDebug assembleRobotDebug

      - name: Unit tests
        run: |
          if [ -x ./gradlew ]; then GRADLE=./gradlew; else GRADLE=gradle; fi
          $GRADLE --no-daemon testEmulatorDebugUnitTest testRobotosDebugUnitTest

      - name: Remove secrets.properties
        if: always()
        run: rm -f secrets.properties

      - uses: actions/upload-artifact@v4
        with:
          name: apk-emulator-debug-${{ github.sha }}
          path: android-app/app/build/outputs/apk/emulator/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: apk-robotos-debug-${{ github.sha }}
          path: android-app/app/build/outputs/apk/robotos/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: apk-robot-debug-${{ github.sha }}
          path: android-app/app/build/outputs/apk/robot/debug/*.apk
          if-no-files-found: error
          retention-days: 14
