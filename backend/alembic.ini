# Alembic: миграции схемы Postgres (docs/db-schema.md).
# URL берётся из DATABASE_URL (app.config.Settings), здесь его нет.
#   uv run alembic upgrade head        (или: uv run python -m app.cli db upgrade)
#   uv run alembic revision -m "..."   — новая миграция (файлы в migrations/versions/)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
