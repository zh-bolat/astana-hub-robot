# ==========================================================================
# Точки карты робота (сняты с getPlaceList 2026-10-25, 9 точек; две служебные
# точки зарядки — «Точка пополнения» и «Зарядная куча» — сюда не входят:
# посетителей туда не водим).
#
#   id           — идентификатор точки (place_id в API, агент передаёт "place:<id>")
#   map_name     — имя точки РОВНО как на карте робота (регистр не важен)
#   names        — название ru/kk/en
#   synonyms     — как посетители называют это место (любой язык); агент видит их как aliases
#   description  — описание ru/kk/en (ответы /ask, /look, агент)
#   visual_hints — как помещение выглядит (подсказка vision-модели для /look)
#   photos       — эталонные фото (пока не используются)
# ==========================================================================
places:
  - id: reception
    map_name: Пункт приема
    names: {ru: Ресепшен, kk: Қабылдау, en: Reception}
    synonyms: [ресепшн, ресепшен, пункт приёма, пункт приема, стойка, администратор, регистрация, пропуск,
               reception, front desk, check-in, қабылдау, тіркеу]
    description:
      ru: Ресепшен — пункт приёма посетителей. Здесь регистрируют гостей, выдают пропуска и отвечают на вопросы.
      kk: Қабылдау — келушілерді қабылдау орны. Мұнда қонақтарды тіркеп, рұқсат қағаздарын береді және сұрақтарға жауап береді.
      en: "The reception desk: guests check in, get passes and ask questions here."
    visual_hints: Стойка администратора с сотрудниками, рядом зона ожидания.
    photos: []

  - id: lift
    map_name: lift
    names: {ru: Лифт, kk: Лифт, en: Elevator}
    synonyms: [лифт, лифты, подъёмник, подъемник, elevator, elevators, lift, lifts, көтергіш]
    description:
      ru: Лифт — подняться или спуститься на другие этажи.
      kk: Лифт — басқа қабаттарға көтерілу немесе түсу үшін.
      en: The elevator to get to the other floors.
    visual_hints: Двери лифта с кнопкой вызова.
    photos: []

  - id: restroom
    map_name: restroom
    names: {ru: Туалет, kk: Дәретхана, en: Restroom}
    synonyms: [туалет, уборная, санузел, wc, вц, restroom, toilet, bathroom, washroom, lavatory, дәретхана, әжетхана]
    description:
      ru: Туалет — ближайший санузел для посетителей.
      kk: Дәретхана — келушілерге арналған ең жақын санузел.
      en: The nearest restroom for visitors.
    visual_hints: Дверь с пиктограммой туалета.
    photos: []

  - id: cafe
    map_name: cafe
    names: {ru: Кафе, kk: Кафе, en: Cafe}
    synonyms: [кафешка, кофейня, кофе, буфет, столовая, поесть, пообедать, еда, обед,
               cafe, coffee, canteen, food, lunch, eat, асхана, кофе ішу, тамақ, тамақтану]
    description:
      ru: Кафе — кофе, выпечка и обеды.
      kk: Кафе — кофе, тоқаштар және түскі ас.
      en: "The cafe: coffee, pastries and lunch."
    visual_hints: Барная стойка с кофемашиной, столики и стулья.
    photos: []

  - id: lecture_hall
    map_name: lecture hall
    names: {ru: Лекторий, kk: Дәріс залы, en: Lecture hall}
    synonyms: [лекторий, лекционный зал, лекция, зал, аудитория, конференц-зал, сцена, мероприятие,
               lecture hall, lecture room, auditorium, hall, conference hall, дәріс залы, дәріс, зал]
    description:
      ru: Лекторий — зал для лекций, митапов и мероприятий.
      kk: Дәріс залы — дәрістер, митаптар мен іс-шараларға арналған зал.
      en: The lecture hall for talks, meetups and events.
    visual_hints: Ряды стульев перед экраном или сценой.
    photos: []

  - id: tiktok_space
    map_name: tiktok space
    names: {ru: TikTok-пространство, kk: TikTok кеңістігі, en: TikTok space}
    synonyms: [тикток, тик ток, тикток спейс, тикток-пространство, студия, съёмка, снимать видео, контент,
               tiktok, tik tok, tiktok space, creator space, studio, content studio, тикток кеңістігі, студия]
    description:
      ru: TikTok-пространство — студия для съёмки видео и создания контента.
      kk: TikTok кеңістігі — бейне түсіруге және контент жасауға арналған студия.
      en: "The TikTok space: a studio for shooting videos and creating content."
    visual_hints: Съёмочная зона с кольцевым светом и фоном для видео.
    photos: []

  - id: snacks
    map_name: snacks
    names: {ru: Снеки, kk: Тіскебасарлар, en: Snacks}
    synonyms: [снеки, снек, перекус, автомат, вендинг, вендинговый автомат, вода, напитки, чипсы, шоколадка,
               snacks, snack, vending, vending machine, drinks, water, тіскебасар, сусын, су]
    description:
      ru: Снеки — зона с перекусом и напитками.
      kk: Тіскебасарлар — тіскебасар мен сусындар аймағы.
      en: The snacks area with snacks and drinks.
    visual_hints: Вендинговый автомат или стойка со снеками и напитками.
    photos: []
