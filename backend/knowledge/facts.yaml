      kk: Нұр Әлем шарында не бар?
      en: What is inside the Nur Alem sphere?
    answer:
      ru: В шаре Нур Алем теперь работает alem.ai — международный центр искусственного интеллекта. Там TUMO Astana для подростков, школа Tomorrow School, Qazaq AI Research University, ИИ-кампус для стартапов и лаборатории.
      kk: Нұр Әлем шарында қазір alem.ai — халықаралық жасанды интеллект орталығы жұмыс істейді. Онда жасөспірімдерге арналған TUMO Astana, Tomorrow School мектебі, Qazaq AI Research University, стартаптарға арналған ЖИ-кампус және зертханалар бар.
      en: The Nur Alem sphere now houses alem.ai, an international artificial intelligence center. It hosts TUMO Astana for teenagers, Tomorrow School, Qazaq AI Research University, an AI campus for startups and labs.

  - id: tumo
    tags: [education]
    keywords: [tumo, тумо, для детей, подростки, школьники, кружок, программирование для детей, teens, kids, children, school students, жасөспірім, балалар, оқушылар, үйірме]
    question:
      ru: Есть ли программы для школьников?
      kk: Оқушыларға арналған бағдарламалар бар ма?
      en: Are there programs for school students?
    answer:
      ru: Для подростков от 12 до 18 лет есть бесплатный центр креативных технологий TUMO Astana в здании alem.ai. Там учат программированию, геймдеву, робототехнике, дизайну, музыке и кино, записаться можно на astana.tumo.kz.
      kk: 12 мен 18 жас аралығындағы жасөспірімдерге alem.ai ғимаратында тегін TUMO Astana шығармашылық технологиялар орталығы бар. Онда бағдарламалау, геймдев, робототехника, дизайн, музыка және кино үйретеді, astana.tumo.kz сайтында жазылуға болады.
      en: Teenagers aged 12 to 18 can join TUMO Astana, a free creative technology center in the alem.ai building. It teaches programming, game development, robotics, design, music and film; sign up at astana.tumo.kz.

  - id: tomorrow_school
    tags: [education]
    keywords: [tomorrow school, тумороу скул, школа ии, бесплатное обучение ии, peer to peer, учиться ии, ai school, learn ai, жи мектебі, жасанды интеллект оқу]
    question:
      ru: Где бесплатно научиться искусственному интеллекту?
      kk: Жасанды интеллектіні қай жерде тегін үйренуге болады?
      en: Where can I study artificial intelligence for free?
    answer:
      ru: Tomorrow School — первая в Казахстане бесплатная peer-to-peer школа искусственного интеллекта, она находится в alem.ai и принимает с 18 лет. Отбор идёт через интенсив «бассейн», подробности на tomorrow-school.ai.
      kk: Tomorrow School — Қазақстандағы алғашқы тегін peer-to-peer жасанды интеллект мектебі, ол alem.ai-да орналасқан және 18 жастан қабылдайды. Іріктеу «бассейн» деп аталатын интенсив арқылы өтеді, толығырақ tomorrow-school.ai сайтында.
      en: Tomorrow School is Kazakhstan's first free peer-to-peer artificial intelligence school, located at alem.ai and open to people 18 and older. Selection goes through an intensive called the pool; details are at tomorrow-school.ai.

  - id: tech_orda
    tags: [education, programs]
    keywords: [tech orda, тех орда, обучение it, грант на обучение, it курсы, научиться программировать, бесплатное обучение, it education, coding course, it оқу, курс, бағдарламалауды үйрену]
    question:
      ru: Что такое Tech Orda?
      kk: Tech Orda деген не?
      en: What is Tech Orda?
    answer:
      ru: Tech Orda — программа, по которой государство оплачивает обучение IT-профессии в частных IT-школах, до 500 тысяч тенге за очный курс. Участвовать могут граждане Казахстана от 18 до 45 лет, опыт в IT не нужен. Набор 2026 года закрылся 7 сентября.
      kk: Tech Orda — мемлекет жеке IT-мектептердегі IT-мамандыққа оқуды төлейтін бағдарлама, күндізгі курс үшін 500 мың теңгеге дейін. Оған 18 бен 45 жас аралығындағы Қазақстан азаматтары қатыса алады, IT тәжірибесі қажет емес. 2026 жылғы қабылдау 7 қыркүйекте жабылды.
      en: Tech Orda is a program in which the state pays for IT training at private IT schools, up to 500,000 tenge for an in-person course. Citizens of Kazakhstan aged 18 to 45 can apply, no IT experience needed. The 2026 intake closed on September 7.

