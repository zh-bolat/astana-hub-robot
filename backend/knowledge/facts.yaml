    answer:
      ru: Сайт хаба — astanahub.com, на русском, казахском и английском. Официальный Telegram-канал — astana_hub, Instagram — astana.hub, есть также YouTube, LinkedIn, Facebook и TikTok.
      kk: Хаб сайты — astanahub.com, қазақ, орыс және ағылшын тілдерінде. Ресми Telegram-арнасы — astana_hub, Instagram — astana.hub, сондай-ақ YouTube, LinkedIn, Facebook және TikTok парақшалары бар.
      en: The hub's website is astanahub.com, in Kazakh, Russian and English. The official Telegram channel is astana_hub, Instagram is astana.hub, and the hub is also on YouTube, LinkedIn, Facebook and TikTok.

  # ---------------------------------------------------------------- адрес и как добраться
  - id: address
    tags: [general, directions]
    keywords: [адрес, где находится, как найти, address, located, where is, мекенжай, қайда орналасқан, павильон, блок, c4.6]
    question:
      ru: Какой адрес у Astana Hub?
      kk: Astana Hub мекенжайы қандай?
      en: What is the address of Astana Hub?
    answer:
      ru: Astana Hub находится в Астане, проспект Мангилик Ел, 55/8, павильон C4.6, на территории EXPO у шара Нур Алем. Всего у хаба три павильона — C4.6, C4.5 и C3.5.
      kk: Astana Hub Астана қаласында, Мәңгілік Ел даңғылы, 55/8, C4.6 павильонында, EXPO аумағында Нұр Әлем шарының жанында орналасқан. Хабтың барлығы үш павильоны бар — C4.6, C4.5 және C3.5.
      en: Astana Hub is at 55/8 Mangilik El Avenue, pavilion C4.6, on the EXPO grounds next to the Nur Alem sphere in Astana. The hub has three pavilions in total, C4.6, C4.5 and C3.5.

  - id: transport_lrt
    tags: [directions]
    keywords: [как добраться, доехать, проехать, lrt, лрт, тарлан, tarlan, электричка, аэропорт, станция, how to get, train, airport, station, қалай жетуге, бекет, әуежай, пойыз]
    question:
      ru: Как доехать до Astana Hub?
      kk: Astana Hub-қа қалай жетуге болады?
      en: How do I get to Astana Hub?
    answer:
      ru: Удобнее всего на LRT Tarlan Astana — выходите на станции «Университет», оттуда около километра, минут 12 пешком. Из аэропорта до этой станции можно доехать без пересадок, проезд стоит 200 тенге.
      kk: Ең ыңғайлысы — Tarlan Astana LRT пойызы, «Университет» бекетінде түсіңіз, одан хабқа дейін шамамен бір шақырым, жаяу 12 минуттай. Әуежайдан бұл бекетке ауыспай жетуге болады, жол ақысы 200 теңге.
      en: The easiest way is the Tarlan Astana LRT; get off at Universitet station, about one kilometer or a 12-minute walk from the hub. You can ride there from the airport without changing trains, and a trip costs 200 tenge.

  - id: transport_bus
    tags: [directions]
    keywords: [автобус, остановка, маршрут, какой автобус, bus, bus stop, route, аялдама, бағыт, қай автобус]
    question:
      ru: Какие автобусы идут до Astana Hub?
      kk: Astana Hub-қа қай автобустар барады?
      en: Which buses go to Astana Hub?
    answer:
      ru: Ближайшая остановка — «Quantum Tech School», туда идёт автобус 18. Чуть дальше, у улицы Рыскулова, остановка «Перинатальный центр №1» — автобусы 7, 40, 42, 43, 47, 51, 53 и 84. Маршруты меняются, перед поездкой проверьте их в 2ГИС.
      kk: Ең жақын аялдама — «Quantum Tech School», оған 18-автобус барады. Сәл әріректе, Рысқұлов көшесінде «№1 перинаталдық орталық» аялдамасы бар — 7, 40, 42, 43, 47, 51, 53 және 84-автобустар. Бағыттар өзгеріп тұрады, жолға шығар алдында 2ГИС-тен тексеріңіз.
      en: The nearest stop is Quantum Tech School, served by bus 18. A bit farther, on Ryskulov Street, the Perinatal Center No. 1 stop is served by buses 7, 40, 42, 43, 47, 51, 53 and 84. Routes change, so check them in 2GIS before you go.

  - id: taxi
    tags: [directions]
    keywords: [такси, яндекс такси, что сказать таксисту, вызвать такси, taxi, cab, yandex, uber, такси шақыру, жүргізуші]
    question:
      ru: Какой адрес назвать таксисту?
      kk: Такси жүргізушісіне қандай мекенжай айту керек?
      en: What address should I give the taxi driver?
    answer:
      ru: Назовите водителю — проспект Мангилик Ел, 55/8, Astana Hub, павильон C4.6, EXPO. Павильон стоит у подножия шара Нур Алем, со стороны улицы Рыскулова.
      kk: Жүргізушіге былай айтыңыз — Мәңгілік Ел даңғылы, 55/8, Astana Hub, C4.6 павильоны, EXPO. Павильон Нұр Әлем шарының етегінде, Рысқұлов көшесі жағында орналасқан.
      en: Tell the driver 55/8 Mangilik El Avenue, Astana Hub, pavilion C4.6, EXPO. The pavilion is at the foot of the Nur Alem sphere, on the Ryskulov Street side.

  - id: parking
    tags: [directions]
    keywords: [парковка, паркинг, припарковаться, машина, автомобиль, оставить машину, parking, car, park, көлік, тұрақ, паркинг]
    question:
      ru: Где можно припарковаться?
      kk: Көлікті қай жерге қоюға болады?
      en: Where can I park?
    answer:
      ru: Рядом есть подземный паркинг EXPO примерно на 3000 мест, въезд с улицы Рыскулова. Он платный, тариф уточните на въезде. От парковки идите на север через центральный проход между павильонами.
      kk: Жанында EXPO-ның шамамен 3000 орындық жерасты паркингі бар, кіреберісі Рысқұлов көшесінен. Ол ақылы, тарифін кіреберісте нақтылаңыз. Паркингтен павильондар арасындағы орталық өткел арқылы солтүстікке қарай жүріңіз.
      en: There is an underground EXPO parking garage with about 3,000 spaces, entered from Ryskulov Street. It is paid, so check the rate at the entrance. From the garage, walk north through the central passage between the pavilions.

  - id: neighbors
    tags: [directions]
    keywords: [что рядом, рядом, по соседству, мфца, aifc, astana it university, мега, hilton, конгресс-центр, nearby, around, neighbors, жанында, маңында, көрші]
    question:
      ru: Что находится рядом с Astana Hub?
      kk: Astana Hub-тың жанында не бар?
      en: What is near Astana Hub?
    answer:
      ru: Рядом на территории EXPO — шар Нур Алем с центром alem.ai, МФЦА, Astana IT University, Конгресс-центр и отель Hilton. К западу — торговый центр Mega Silk Way.
      kk: EXPO аумағында жақын жерде — alem.ai орталығы бар Нұр Әлем шары, АХҚО, Astana IT University, Конгресс-орталық және Hilton қонақүйі. Батыс жағында — Mega Silk Way сауда орталығы.
      en: Nearby on the EXPO grounds are the Nur Alem sphere with the alem.ai center, the AIFC, Astana IT University, the Congress Center and the Hilton hotel. To the west is the Mega Silk Way mall.

  # ---------------------------------------------------------------- часы работы, вход, правила
  - id: hours
    tags: [general, hours]
    keywords: [часы, график, работает, открыт, время работы, режим, до скольки, выходные, hours, open, schedule, weekend, жұмыс уақыты, кесте, ашық, демалыс]
    question:
      ru: Во сколько работает хаб?
      kk: Хаб қашан жұмыс істейді?
      en: What are the opening hours?
    answer:
      ru: Администрация Astana Hub работает по будням с 9:00 до 18:30. Участники программ и арендаторы могут заходить в здание круглосуточно, включая выходные и праздники.
      kk: Astana Hub әкімшілігі жұмыс күндері 9:00-ден 18:30-ға дейін жұмыс істейді. Бағдарлама қатысушылары мен жалға алушылар ғимаратқа демалыс және мереке күндерін қоса алғанда тәулік бойы кіре алады.
      en: The Astana Hub administration works on weekdays from 9:00 to 18:30. Program participants and tenants can enter the building around the clock, including weekends and holidays.

  - id: guest_access
    tags: [access]
    keywords: [пропуск, гость, войти, пройти, вход, регистрация гостя, пустят ли, guest, pass, entry, access, visit, кіру, қонақ, рұқсат, тіркелу]
    question:
      ru: Как пройти в Astana Hub гостю?
      kk: Қонақ Astana Hub-қа қалай кіреді?
      en: How can a guest get into Astana Hub?
    answer:
      ru: Гость заполняет регистрационную форму на ресепшене, после этого резидент встречает его у стойки и сам проводит в павильон. Участники программ проходят по Face ID.
      kk: Қонақ ресепшенде тіркеу нысанын толтырады, содан кейін резидент оны үстел жанынан қарсы алып, павильонға өзі алып кіреді. Бағдарлама қатысушылары Face ID арқылы кіреді.
      en: A guest fills in a registration form at the reception, and then the resident meets them at the desk and accompanies them into the pavilion. Program participants enter with Face ID.

  - id: face_id
    tags: [access, residents]
    keywords: [face id, фейс айди, биометрия, доступ в здание, пропуск сотрудника, access card, biometrics, рұқсат, биометрия, кіру рұқсаты]
    question:
      ru: Как получить Face ID для входа?
      kk: Кіру үшін Face ID-ді қалай алуға болады?
      en: How do I get Face ID access?
    answer:
      ru: Face ID оформляют участникам программ Astana Hub по заявке на сайте astanahub.com, в разделе «Инфраструктура». Администрация подтверждает доступ по будням с 9:00 до 18:30, в выходные и праздники не оформляет.
      kk: Face ID Astana Hub бағдарламаларының қатысушыларына astanahub.com сайтындағы «Инфрақұрылым» бөліміндегі өтінім бойынша рәсімделеді. Әкімшілік рұқсатты жұмыс күндері 9:00-ден 18:30-ға дейін береді, демалыс және мереке күндері рәсімдемейді.
      en: Face ID is set up for Astana Hub program participants through a request on astanahub.com, in the Infrastructure section. The administration approves access on weekdays from 9:00 to 18:30, not on weekends or holidays.

  - id: rules
    tags: [access]
    keywords: [правила, можно ли, запрещено, животные, собака, самокат, велосипед, курить, курилка, алкоголь, rules, allowed, pets, dog, scooter, bike, smoking, ереже, болады ма, тыйым, жануар, темекі]
    question:
      ru: Какие правила поведения в Astana Hub?
      kk: Astana Hub-та қандай тәртіп ережелері бар?
      en: What are the rules at Astana Hub?
    answer:
      ru: С животными нельзя, кроме собак-поводырей. Велосипеды и самокаты внутрь не проносят, алкоголь запрещён, курить можно только в отведённых местах. Есть можно в специально отведённых зонах, а музыку слушать — в наушниках.
      kk: Жануарлармен кіруге болмайды, бағыттаушы иттерден басқа. Велосипед пен самокатты ішке кіргізбейді, алкогольге тыйым салынған, темекіні тек арнайы бөлінген жерлерде шегуге болады. Тамақты арнайы бөлінген аймақтарда ішуге болады, ал музыканы құлаққаппен тыңдаңыз.
      en: Pets are not allowed, except guide dogs. Bikes and scooters stay outside, alcohol is prohibited, and smoking is allowed only in designated areas. You can eat in designated areas, and please use headphones for music.

  - id: photo_video
    tags: [access]
    keywords: [фото, фотографировать, снимать, съёмка, видео, photo, video, filming, camera, суретке түсіру, бейне, түсірілім]
    question:
      ru: Можно ли здесь фотографировать?
      kk: Мұнда суретке түсіруге бола ма?
      en: Can I take photos here?
    answer:
      ru: Снимать на телефон можно. Профессиональную фото- и видеосъёмку нужно заранее согласовать с администрацией хаба.
      kk: Телефонға түсіруге болады. Кәсіби фото және бейне түсірілімді хаб әкімшілігімен алдын ала келісу керек.
      en: Taking photos on your phone is fine. Professional photo or video shoots must be agreed with the hub administration in advance.

  - id: excursion
    tags: [access, visit]
    keywords: [экскурсия, тур, посмотреть хаб, группа, школьники, делегация, 3d тур, excursion, tour, visit, group, саяхат, топ, оқушылар]
    question:
      ru: Можно ли прийти на экскурсию?
      kk: Экскурсияға келуге бола ма?
