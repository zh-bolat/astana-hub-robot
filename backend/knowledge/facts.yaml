      ru: TikTok Space — первое в Казахстане официальное пространство TikTok, оно появилось в Astana Hub в 2022 году. Здесь снимали видео стартапы и проходили мастер-классы по продвижению в TikTok. Как им воспользоваться сейчас, уточните на ресепшене.
      kk: TikTok Space — Қазақстандағы алғашқы ресми TikTok кеңістігі, ол Astana Hub-та 2022 жылы пайда болды. Мұнда стартаптар бейне түсіріп, TikTok-та жылжыту бойынша шеберлік сабақтары өтті. Қазір оны қалай пайдалануға болатынын ресепшеннен нақтылаңыз.
      en: TikTok Space is the first official TikTok space in Kazakhstan; it opened at Astana Hub in 2022. Startups shot videos here and held master classes on TikTok promotion. Please check with the reception how to use it now.

  - id: cafe
    tags: [food]
    keywords: [кафе, кофе, кофейня, поесть, еда, столовая, обед, global coffee, cafe, coffee, food, lunch, асхана, тамақ, кофе ішу]
    question:
      ru: Где здесь можно поесть?
      kk: Мұнда қай жерде тамақтануға болады?
      en: Where can I get something to eat?
    answer:
      ru: В павильоне C4.6 есть кофейня Global coffee, она открывается в 8:30. Рядом, к западу от EXPO, торговый центр Mega Silk Way с фудкортом. Могу показать дорогу до кафе.
      kk: C4.6 павильонында Global coffee кофеханасы бар, ол 8:30-да ашылады. Жақын жерде, EXPO-ның батыс жағында, фудкорты бар Mega Silk Way сауда орталығы орналасқан. Кафеге дейін жол көрсете аламын.
      en: Pavilion C4.6 has the Global coffee café, which opens at 8:30. Nearby, west of EXPO, the Mega Silk Way mall has a food court. I can show you the way to the café.

