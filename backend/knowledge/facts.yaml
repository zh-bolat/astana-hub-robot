      en: Yes. The flagship is Silkway Accelerator with Google for Startups; there are also Tech Incubator for hardware and cybersecurity, Startup Orda in the regions, AI'preneurs and GamePreneurs. All intakes and deadlines are in the Programs section on astanahub.com.

  - id: silkway
    tags: [programs]
    keywords: [silkway, силквей, силк вей, google for startups, гугл, silkway accelerator]
    question:
      ru: Что такое Silkway Accelerator?
      kk: Silkway Accelerator деген не?
      en: What is Silkway Accelerator?
    answer:
      ru: Silkway Accelerator — флагманский акселератор Astana Hub и Google for Startups для стартапов с выручкой из Центральной Азии, Кавказа и Монголии. Программа длится 12 недель, участникам дают офис, коливинг и до 100 тысяч долларов кредитов Google Cloud. Набор 2026 года закрыт.
      kk: Silkway Accelerator — Astana Hub пен Google for Startups-тың басты акселераторы, Орталық Азия, Кавказ және Моңғолиядағы табысы бар стартаптарға арналған. Бағдарлама 12 апта, қатысушыларға кеңсе, коливинг және 100 мың долларға дейін Google Cloud кредиттері беріледі. 2026 жылғы қабылдау жабылды.
      en: Silkway Accelerator is the flagship accelerator of Astana Hub and Google for Startups for revenue-stage startups from Central Asia, the Caucasus and Mongolia. It lasts 12 weeks and gives an office, coliving and up to 100,000 dollars in Google Cloud credits. The 2026 intake is closed.

  - id: investment
    tags: [programs, investment]
    keywords: [инвестиции, инвестор, венчур, финансирование, грант, деньги на стартап, astana hub ventures, investment, investor, venture, funding, grant, инвестиция, грант, қаржыландыру]
