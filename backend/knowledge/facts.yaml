facts:
  # ---------------------------------------------------------------- о хабе
  - id: about
    tags: [general]
    keywords: [astana hub, астана хаб, что такое, технопарк, кластер, technopark, cluster, деген не, не туралы]
    question:
      ru: Что такое Astana Hub?
      kk: Astana Hub деген не?
      en: What is Astana Hub?
    answer:
      ru: Astana Hub — международный инновационный кластер и технопарк IT-стартапов в Астане. В нём больше 2500 казахстанских и зарубежных компаний-участников, здесь проходят акселераторы, обучение и мероприятия.
      kk: Astana Hub — Астанадағы халықаралық инновациялық кластер және IT-стартаптар технопаркі. Мұнда 2500-ден астам қазақстандық және шетелдік қатысушы компания бар, акселераторлар, оқу бағдарламалары мен іс-шаралар өтеді.
      en: Astana Hub is an international innovation cluster and technology park for IT startups in Astana. It has more than 2,500 member companies from Kazakhstan and abroad and runs accelerators, training programs and events.

  - id: history
    tags: [general]
    keywords: [история, когда открыли, основан, год основания, history, founded, opened, тарих, ашылды, құрылды]
    question:
      ru: Когда открылся Astana Hub?
      kk: Astana Hub қашан ашылды?
      en: When did Astana Hub open?
    answer:
      ru: Astana Hub официально открылся 6 ноября 2018 года в павильоне на территории EXPO. В 2025 году его объединили с Парком инновационных технологий, теперь это автономный кластерный фонд «Астана Хаб».
      kk: Astana Hub 2018 жылғы 6 қарашада EXPO аумағындағы павильонда ресми түрде ашылды. 2025 жылы ол Инновациялық технологиялар паркімен біріктірілді, қазір бұл «Астана Хаб» дербес кластерлік қоры.
      en: Astana Hub officially opened on November 6, 2018, in a pavilion on the EXPO grounds. In 2025 it merged with the Park of Innovative Technologies and is now the Autonomous Cluster Fund Astana Hub.

  - id: leadership
    tags: [general]
    keywords: [директор, руководитель, глава, ceo, генеральный директор, мадиев, министерство, director, head, ministry, басшы, директоры, министрлік]
    question:
      ru: Кто руководит Astana Hub?
      kk: Astana Hub-ты кім басқарады?
      en: Who runs Astana Hub?
    answer:
      ru: Генеральный директор Astana Hub — Магжан Мадиев. Хаб курирует Министерство искусственного интеллекта и цифрового развития Казахстана.
      kk: Astana Hub бас директоры — Мағжан Мадиев. Хабқа Қазақстанның Жасанды интеллект және цифрлық даму министрлігі жетекшілік етеді.
      en: The CEO of Astana Hub is Magzhan Madiyev. The hub is overseen by Kazakhstan's Ministry of Artificial Intelligence and Digital Development.

  - id: numbers
    tags: [general]
    keywords: [сколько компаний, сколько резидентов, участников, цифры, статистика, выручка, экспорт, how many, statistics, revenue, export, қанша компания, сандар, табыс]
    question:
      ru: Сколько компаний в Astana Hub?
      kk: Astana Hub-та қанша компания бар?
      en: How many companies are in Astana Hub?
    answer:
      ru: В Astana Hub больше 2500 компаний-участников. По итогам 2025 года они заработали больше 1,7 миллиарда долларов, а экспорт их IT-услуг превысил 600 миллионов долларов, услуги продавали в 111 стран.
      kk: Astana Hub-та 2500-ден астам қатысушы компания бар. 2025 жылдың қорытындысы бойынша олардың табысы 1,7 миллиард доллардан асты, ал IT-қызметтер экспорты 600 миллион доллардан асты, қызметтер 111 елге сатылды.
      en: Astana Hub has more than 2,500 member companies. In 2025 they earned over 1.7 billion dollars, and their IT exports exceeded 600 million dollars, with services sold to 111 countries.

  - id: contacts
    tags: [general, contacts]
    keywords: [контакты, телефон, позвонить, номер, почта, email, связаться, contact, phone, call, байланыс, қоңырау, нөмір, пошта, хабарласу]
