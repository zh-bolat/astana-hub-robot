      ru: Да, на astanahub.com открыты бесплатные онлайн-курсы — QazCoders, «Основы ИИ — ChatGPT» от Skillbox, «Основы анализа данных и Python» с Яндекс Практикумом, а также No Code, Low Code и Freelance School.
      kk: Иә, astanahub.com сайтында тегін онлайн-курстар ашық — QazCoders, Skillbox-тың «ЖИ негіздері — ChatGPT» курсы, Яндекс Практикуммен бірге «Деректерді талдау және Python негіздері», сондай-ақ No Code, Low Code және Freelance School.
      en: Yes, astanahub.com offers free online courses, including QazCoders, AI Basics with ChatGPT by Skillbox, Data Analysis and Python Basics with Yandex Practicum, plus No Code, Low Code and Freelance School.

  # ---------------------------------------------------------------- участие (резидентство)
  - id: residency
    tags: [programs, residents]
    keywords: [резидент, резидентство, участник, стать участником, вступить, заявка, resident, residency, become a member, join, apply, резидент болу, қатысушы, өтінім]
    question:
      ru: Как стать резидентом Astana Hub?
      kk: Astana Hub резиденті қалай болуға болады?
      en: How do I become an Astana Hub resident?
    answer:
      ru: Нужно открыть личный кабинет на astanahub.com и подать онлайн-заявку с бизнес-планом и справкой об отсутствии налоговой задолженности. Подать могут IT-компании, юрлица, у которых не меньше девяноста процентов дохода от приоритетных видов IT-деятельности. Подача бесплатная.
      kk: astanahub.com сайтында жеке кабинет ашып, бизнес-жоспар мен салық берешегінің жоқтығы туралы анықтама қоса онлайн-өтінім беру керек. Өтінімді табысының кемінде тоқсан пайызы басым IT-қызмет түрлерінен түсетін IT-компаниялар, яғни заңды тұлғалар бере алады. Өтінім беру тегін.
      en: Create an account on astanahub.com and submit an online application with a business plan and a certificate of no tax debt. IT companies registered as legal entities, with at least 90 percent of income from priority IT activities, can apply. Applying is free.

  - id: residency_timeline
    tags: [programs, residents]
    keywords: [сколько рассматривают, срок рассмотрения, комиссия, когда ответят, свидетельство, review time, how long, decision, certificate, мерзім, қанша уақыт, комиссия, куәлік]
    question:
      ru: Сколько рассматривают заявку на участие?
      kk: Қатысуға өтінім қанша уақыт қаралады?
      en: How long does the application review take?
    answer:
      ru: Сначала фонд проверяет заявку до 15 рабочих дней, затем решение принимает комиссия по отбору участников. После подписания договора электронное свидетельство участника выдают за три рабочих дня.
      kk: Алдымен қор өтінімді 15 жұмыс күніне дейін тексереді, содан кейін шешімді қатысушыларды іріктеу комиссиясы қабылдайды. Шартқа қол қойылғаннан кейін қатысушының электрондық куәлігі үш жұмыс күні ішінде беріледі.
      en: First the fund checks the application for up to 15 working days, then the participant selection committee decides. After the contract is signed, the electronic participant certificate is issued within three working days.

  - id: residency_benefits
    tags: [programs, residents]
    keywords: [льготы, налоги, налоговые льготы, кпн, ндс, ипн, соцналог, преимущества, зачем вступать, benefits, tax, taxes, vat, incentives, жеңілдік, салық, артықшылық]
    question:
      ru: Какие льготы у участников Astana Hub?
      kk: Astana Hub қатысушыларына қандай жеңілдіктер бар?
      en: What benefits do Astana Hub participants get?
    answer:
      ru: Участники освобождаются от корпоративного подоходного налога и НДС, а с зарплат сотрудников не удерживается ИПН. Соцналог за иностранных сотрудников не платится. Льготы действуют до 1 января 2029 года.
      kk: Қатысушылар корпоративтік табыс салығы мен ҚҚС-тан босатылады, ал қызметкерлердің жалақысынан ЖТС ұсталмайды. Шетелдік қызметкерлер үшін әлеуметтік салық төленбейді. Жеңілдіктер 2029 жылғы 1 қаңтарға дейін қолданылады.
      en: Participants are exempt from corporate income tax and VAT, and no personal income tax is withheld from employee salaries. Social tax is not paid for foreign employees. These benefits apply until January 1, 2029.

  - id: residency_duties
    tags: [programs, residents]
    keywords: [членский взнос, обязанности, отчёт, сколько платить, взнос, обязательства, membership fee, obligations, report, мүшелік жарна, міндет, есеп]
    question:
      ru: Что должен делать участник Astana Hub?
      kk: Astana Hub қатысушысы не істеуі керек?
      en: What are the obligations of an Astana Hub participant?
    answer:
      ru: Участник платит ежеквартальный членский взнос, один процент от дохода за прошлый квартал, и сдаёт квартальный отчёт до 20 числа следующего месяца. Ещё нужно выполнять встречные обязательства перед IT-экосистемой.
      kk: Қатысушы тоқсан сайын мүшелік жарна төлейді, бұл өткен тоқсандағы табыстың бір пайызы, және келесі айдың 20-сына дейін тоқсандық есеп тапсырады. Сондай-ақ IT-экожүйе алдындағы қарсы міндеттемелерді орындау керек.
      en: A participant pays a quarterly membership fee of one percent of the previous quarter's income and submits a quarterly report by the 20th of the following month. They also fulfil reciprocal commitments to the IT ecosystem.

  - id: residency_consult
    tags: [programs, residents]
    keywords: [консультация, помощь с заявкой, вопросы по вступлению, consultation, help with application, кеңес, тіркелу бойынша кеңес]
    question:
      ru: Где получить консультацию по вступлению в хаб?
      kk: Хабқа тіркелу бойынша қайдан кеңес алуға болады?
      en: Where can I get advice on joining the hub?
    answer:
      ru: В разделе «Программы» на astanahub.com есть бесплатная «Консультация по вступлению в Astana Hub». Также можно позвонить по номеру 1818.
      kk: astanahub.com сайтындағы «Бағдарламалар» бөлімінде тегін «Astana Hub-қа тіркелу бойынша консультация» бар. Сондай-ақ 1818 нөміріне қоңырау шалуға болады.
      en: The Programs section on astanahub.com offers a free consultation on joining Astana Hub. You can also call 1818.

  - id: foreign_specialists
    tags: [programs, international]
    keywords: [иностранцы, иностранный специалист, виза, рабочая виза, релокация, переезд компании, expat, visa, work visa, foreigners, relocation, шетелдік маман, виза, көшу]
    question:
      ru: Какие условия для иностранных специалистов?
      kk: Шетелдік мамандарға қандай жағдайлар бар?
      en: What are the conditions for foreign specialists?
    answer:
      ru: Участники Astana Hub могут нанимать иностранных специалистов без квот и без госпошлины за разрешение на работу. Сотрудники и их семьи получают визу до пяти лет. Для переезда компаний есть сервисы Expat Centre и One Stop Shop.
      kk: Astana Hub қатысушылары шетелдік мамандарды квотасыз және жұмысқа рұқсат үшін мемлекеттік бажсыз жалдай алады. Қызметкерлер мен олардың отбасылары бес жылға дейінгі виза алады. Компаниялардың көшуіне арналған Expat Centre және One Stop Shop қызметтері бар.
      en: Astana Hub participants can hire foreign specialists without quotas and without the state fee for a work permit. Employees and their families get visas for up to five years. Expat Centre and One Stop Shop help companies relocate.

  - id: digital_nomad
    tags: [programs, international]
    keywords: [digital nomad, цифровой кочевник, номад, удалёнщик, виза для удалёнки, nomad visa, remote worker, цифрлық көшпенді]
    question:
      ru: Есть ли виза для цифровых кочевников?
      kk: Цифрлық көшпенділерге арналған виза бар ма?
      en: Is there a digital nomad visa?
    answer:
      ru: Да, через Astana Hub оформляют Digital Nomad Visa и Digital Nomad Residency для удалённых IT-специалистов. Условия смотрите в разделе «Программы» на astanahub.com.
      kk: Иә, Astana Hub арқылы қашықтан жұмыс істейтін IT-мамандарға Digital Nomad Visa және Digital Nomad Residency рәсімделеді. Шарттарын astanahub.com сайтындағы «Бағдарламалар» бөлімінен қараңыз.
      en: Yes, Astana Hub handles the Digital Nomad Visa and Digital Nomad Residency for remote IT specialists. See the conditions in the Programs section on astanahub.com.

  # ---------------------------------------------------------------- программы и финансирование
  - id: accelerator
    tags: [programs]
    keywords: [акселератор, инкубатор, программа для стартапов, акселерация, accelerator, incubator, startup program, акселерация, бағдарлама, инкубатор]
    question:
