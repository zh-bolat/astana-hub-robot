    answer:
      ru: Короткий номер Astana Hub — 1818, городской — +7 7172 73 50 89. Почта для общих вопросов — info@astanahub.com.
      kk: Astana Hub қысқа нөмірі — 1818, қалалық нөмірі — +7 7172 73 50 89. Жалпы сұрақтарға арналған пошта — info@astanahub.com.
      en: Astana Hub's short number is 1818, and the city number is +7 7172 73 50 89. The email for general questions is info@astanahub.com.

  - id: social_media
    tags: [general, contacts]
    keywords: [соцсети, телеграм, инстаграм, сайт, новости, social media, telegram, instagram, website, news, әлеуметтік желі, сайт, жаңалықтар]
