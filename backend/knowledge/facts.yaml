      kk: Стартапқа инвестицияны қалай алуға болады?
      en: How can my startup get investment?
    answer:
      ru: У хаба есть венчурный фонд Astana Hub Ventures, он вкладывает от 50 до 500 тысяч долларов на ранних стадиях, в первую очередь в выпускников программ хаба. Гранты и другие программы финансирования публикуются в разделе «Программы» на astanahub.com.
      kk: Хабтың Astana Hub Ventures венчурлық қоры бар, ол ерте кезеңдегі стартаптарға 50-ден 500 мың долларға дейін салады, ең алдымен хаб бағдарламаларының түлектеріне. Гранттар мен басқа қаржыландыру бағдарламалары astanahub.com сайтындағы «Бағдарламалар» бөлімінде жарияланады.
      en: The hub has a venture fund, Astana Hub Ventures, which invests 50,000 to 500,000 dollars at early stages, mainly in graduates of hub programs. Grants and other funding programs are listed in the Programs section on astanahub.com.

  - id: hub_perks
    tags: [programs]
    keywords: [hub perks, скидки, бесплатные сервисы, github, jetbrains, облако, бонусы, perks, discounts, credits, жеңілдіктер, бонустар]
    question:
      ru: Какие бонусы получают стартапы-участники?
      kk: Қатысушы стартаптар қандай бонустар алады?
      en: What perks do member startups get?
    answer:
      ru: Через Hub Perks участники получают бесплатные и льготные сервисы партнёров, например GitHub Enterprise на год бесплатно, лицензии JetBrains на полгода, а также облака Yandex Cloud и Alibaba Cloud.
      kk: Hub Perks арқылы қатысушылар серіктестердің тегін және жеңілдікті қызметтерін алады, мысалы бір жылға тегін GitHub Enterprise, жарты жылға JetBrains лицензиялары, сондай-ақ Yandex Cloud және Alibaba Cloud бұлттары.
      en: Through Hub Perks, participants get free and discounted partner services, for example a free year of GitHub Enterprise, six months of JetBrains licenses, and Yandex Cloud and Alibaba Cloud.

  - id: tech_tasks
    tags: [programs]
    keywords: [технологические задачи, заказы, корпорации, hub market, задача от компании, недропользователи, корпоративные инновации, tech tasks, corporate innovation, технологиялық тапсырмалар, тапсырыс]
    question:
      ru: Где найти заказы от корпораций?
      kk: Корпорациялардан тапсырысты қайдан табуға болады?
      en: Where can I find projects from corporations?
    answer:
      ru: В разделе «Технологические задачи» на Hub Market компании и госорганы публикуют свои задачи, а IT-компании и стартапы предлагают решения. Исполнителя выбирает заказчик.
      kk: Hub Market-тегі «Технологиялық тапсырмалар» бөлімінде компаниялар мен мемлекеттік органдар өз тапсырмаларын жариялайды, ал IT-компаниялар мен стартаптар шешім ұсынады. Орындаушыны тапсырыс беруші таңдайды.
      en: In the Tech Tasks section of Hub Market, companies and government bodies post their challenges, and IT companies and startups propose solutions. The customer chooses the contractor.

  - id: partnership
    tags: [programs, contacts]
    keywords: [стать инвестором, стать ментором, эксперт, спикер, трекер, партнёр, сотрудничество, mentor, become an investor, partner, cooperation, speaker, ментор, серіктес, ынтымақтастық, сарапшы]
    question:
      ru: Как стать ментором или партнёром хаба?
      kk: Хабтың менторы немесе серіктесі қалай болуға болады?
      en: How can I become a mentor or partner of the hub?
    answer:
      ru: Менторы, трекеры, спикеры и эксперты заполняют форму сотрудничества на astanahub.com, а инвесторы проходят «Регистрацию инвестора» в разделе «Программы». По партнёрству пишите на info@astanahub.com.
      kk: Менторлар, трекерлер, спикерлер және сарапшылар astanahub.com сайтында ынтымақтастық нысанын толтырады, ал инвесторлар «Бағдарламалар» бөлімінде «Инвестордың тіркелуі» арқылы тіркеледі. Серіктестік бойынша info@astanahub.com поштасына жазыңыз.
      en: Mentors, trackers, speakers and experts fill in the cooperation form on astanahub.com, and investors use Investor Registration in the Programs section. For partnerships, write to info@astanahub.com.

  - id: regional_hubs
    tags: [programs, international]
    keywords: [регионы, региональные хабы, другие города, алматы, шымкент, караганда, зарубежные хабы, regional hubs, other cities, almaty, abroad, өңірлер, өңірлік хабтар, басқа қалалар]
    question:
      ru: Есть ли хабы в других городах?
      kk: Басқа қалаларда хабтар бар ма?
      en: Are there hubs in other cities?
    answer:
      ru: Да, у Astana Hub около двадцати региональных IT-хабов по Казахстану, например Almaty Hub, Shymkent Hub, Terricon Valley в Караганде, Batys Hub в Уральске и Mangystau Hub в Актау. За рубежом есть партнёрские хабы в Пало-Альто, Лондоне, Дубае и Шанхае.
      kk: Иә, Astana Hub-тың Қазақстан бойынша жиырмаға жуық өңірлік IT-хабы бар, мысалы Almaty Hub, Shymkent Hub, Қарағандыдағы Terricon Valley, Оралдағы Batys Hub және Ақтаудағы Mangystau Hub. Шетелде Пало-Альто, Лондон, Дубай және Шанхайда серіктес хабтар бар.
      en: Yes, Astana Hub has about twenty regional IT hubs across Kazakhstan, such as Almaty Hub, Shymkent Hub, Terricon Valley in Karaganda, Batys Hub in Uralsk and Mangystau Hub in Aktau. Abroad, there are partner hubs in Palo Alto, London, Dubai and Shanghai.

  # ---------------------------------------------------------------- мероприятия
  - id: events_registration
    tags: [events]
    keywords: [мероприятия, расписание, афиша, регистрация, ивент, митап, как попасть на мероприятие, event, events, schedule, meetup, registration, іс-шара, кесте, тіркеу]
    question:
      ru: Как попасть на мероприятие?
      kk: Іс-шараға қалай қатысуға болады?
      en: How do I attend an event?
    answer:
      ru: Расписание — на astanahub.com в разделе «Мероприятия» и в Telegram-канале astana_hub. В карточке события нажмите «Заявка на участие», получите QR-код и покажите его на входе. Многие события бесплатные, условия указаны в карточке.
      kk: Кесте astanahub.com сайтындағы «Іс-шаралар» бөлімінде және astana_hub Telegram-арнасында. Іс-шара парақшасында қатысуға өтінім батырмасын басып, QR-код алыңыз да, кіреберісте көрсетіңіз. Көп іс-шара тегін, шарттары парақшада көрсетілген.
      en: The schedule is on astanahub.com under Events and in the astana_hub Telegram channel. On the event page, apply to participate, get a QR code and show it at the entrance. Many events are free; the conditions are on the event page.

  - id: digital_bridge
    tags: [events]
    keywords: [digital bridge, диджитал бридж, ai digital bridge, форум, конференция, forum, conference, форум]
    question:
      ru: Что такое Digital Bridge?
      kk: Digital Bridge деген не?
      en: What is Digital Bridge?
    answer:
      ru: AI & Digital Bridge — ежегодный международный технологический форум Astana Hub в МВЦ EXPO. В 2026 году он прошёл с 1 по 3 октября и собрал больше 18 тысяч посетителей. Даты следующего форума пока не объявлены.
      kk: AI & Digital Bridge — Astana Hub-тың EXPO халықаралық көрме орталығында өтетін жыл сайынғы халықаралық технологиялық форумы. 2026 жылы ол 1–3 қазанда өтіп, 18 мыңнан астам келушіні жинады. Келесі форумның күндері әлі жарияланған жоқ.
      en: AI & Digital Bridge is Astana Hub's annual international technology forum at the EXPO exhibition center. In 2026 it took place on October 1 to 3 and drew more than 18,000 visitors. Dates for the next forum have not been announced yet.

  - id: hackathons
    tags: [events]
    keywords: [хакатон, хакатоны, hackathon, hackalem, рекорд, гиннесс, guinness, хакатон, рекорд]
    question:
      ru: Проходят ли здесь хакатоны?
      kk: Мұнда хакатондар өте ме?
      en: Are there hackathons here?
    answer:
      ru: Да, хакатоны проходят регулярно, анонсы — в разделе «Мероприятия» на astanahub.com. В сентябре 2026 года HackAlem AI в alem.ai попал в Книгу рекордов Гиннесса как самый массовый AI-хакатон, у него было 2415 участников.
      kk: Иә, хакатондар үнемі өтеді, хабарландырулар astanahub.com сайтындағы «Іс-шаралар» бөлімінде. 2026 жылдың қыркүйегінде alem.ai-дағы HackAlem AI ең көп адам қатысқан AI-хакатон ретінде Гиннесс рекордтар кітабына енді, оған 2415 адам қатысты.
      en: Yes, hackathons take place regularly; see the Events section on astanahub.com. In September 2026, HackAlem AI at alem.ai set a Guinness World Record as the largest AI hackathon, with 2,415 participants.

  # ---------------------------------------------------------------- работа, пресса
  - id: vacancies
    tags: [careers]
    keywords: [работа, вакансии, трудоустройство, найти работу, стажировка, резюме, job, jobs, vacancy, career, internship, cv, жұмыс, бос орын, тағылымдама, түйіндеме]
    question:
      ru: Как найти работу в IT-компаниях хаба?
      kk: Хабтағы IT-компанияларда жұмысты қалай табуға болады?
      en: How can I find a job at the hub's IT companies?
    answer:
      ru: Вакансии компаний-участников публикуются в разделе «Вакансии» на astanahub.com, сейчас их больше пяти тысяч. Резюме в команду самого Astana Hub отправляют на cv@astanahub.com, летом хаб набирает стажёров.
      kk: Қатысушы компаниялардың бос орындары astanahub.com сайтындағы «Вакансиялар» бөлімінде жарияланады, қазір олар бес мыңнан асады. Astana Hub командасына түйіндемені cv@astanahub.com поштасына жібереді, жазда хаб тағылымдамашыларды қабылдайды.
      en: Job openings at member companies are posted in the Vacancies section on astanahub.com, currently more than five thousand. To join the Astana Hub team itself, send your CV to cv@astanahub.com; the hub recruits interns in summer.

  - id: press
    tags: [contacts]
    keywords: [пресса, сми, журналист, интервью, комментарий, press, media, journalist, interview, бақ, журналист, сұхбат]
    question:
      ru: Куда обращаться журналистам?
      kk: Журналистер қайда хабарласуы керек?
      en: Who should journalists contact?
    answer:
      ru: Журналистам — на почту media@astanahub.com или через форму «Запросы от СМИ» на сайте astanahub.com.
      kk: Журналистер media@astanahub.com поштасына немесе astanahub.com сайтындағы «БАҚ сұраулары» нысаны арқылы хабарласады.
      en: Journalists can write to media@astanahub.com or use the media request form on astanahub.com.
