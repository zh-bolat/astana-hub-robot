# ==========================================================================
# Точки карты робота Курултая (карта kur-1109113033, docs/kurultai/navigation.md).
# Две точки зарядки («Точка пополнения…», «Зарядная куча», «Полюс зарядки1») сюда не входят:
# посетителей туда не водим.
#
#   id          — place_id в кадрах action/state (контракт робот ↔ сервер)
#   map_name    — имя точки РОВНО как на карте робота (робот передаёт в startNavigation как есть)
#   names       — название ru/kk (так робот называет место вслух)
#   synonyms    — как посетители называют это место (ru/kk/en, регистр не важен)
#   description — описание ru/kk (одно предложение, для инструкций модели)
#   service     — служебная точка (пост робота): посетителям не предлагается и целью guide_to не бывает,
#                 но в state от робота (авто-возврат) распознаётся
#
# Подтверждено владельцем 10.11: InvitationRoom — комната для приглашённых; «Пункт приема» — стартовая точка
# робота (home). Правка точек — только здесь (образ: COPY knowledge).
# Загрузчик: app/kurultai/places.py; в сессии Realtime доступны только точки из hello.places робота.
# ==========================================================================
places:
  - id: museum
    map_name: MuseumKurultai
    names: {ru: Музей Курултая, kk: Құрылтай мұражайы}
    synonyms: [музей, музей курултая, экспозиция, выставка, экспонаты, история курултая,
               мұражай, құрылтай мұражайы, көрме, экспозиция, museum, exhibition]
    description:
      ru: Музей Курултая — экспозиция об истории и работе Курултая.
      kk: Құрылтай мұражайы — Құрылтайдың тарихы мен жұмысы туралы көрме.

  - id: restroom
    map_name: restroom
    names: {ru: Туалет, kk: Дәретхана}
    synonyms: [туалет, уборная, санузел, wc, вц, умывальник, руки помыть,
               дәретхана, әжетхана, қол жуу, restroom, toilet, bathroom, washroom]
    description:
      ru: Туалет — ближайший санузел для посетителей.
      kk: Дәретхана — келушілерге арналған ең жақын дәретхана.

  - id: wardrobe
    map_name: Wardrobe
    names: {ru: Гардероб, kk: Гардероб}
    synonyms: [гардероб, раздевалка, вешалка, куртка, пальто, верхняя одежда, сдать одежду, забрать одежду,
               киім ілгіш, киім, сырт киім, пальто, wardrobe, cloakroom, coat]
    description:
      ru: Гардероб — здесь принимают и выдают верхнюю одежду.
      kk: Гардероб — мұнда сырт киімді қабылдап, қайтарып береді.

  - id: lobby
    map_name: Lobby
    names: {ru: Холл, kk: Холл}
    synonyms: [холл, фойе, вестибюль, вход, выход, главный вход, к выходу, на выход, обратно, назад,
               кіреберіс, шығу, шығатын жер, кері, фойе, lobby, hall, entrance, exit]
    description:
      ru: Холл — фойе у входа, откуда расходятся залы и коридоры.
      kk: Холл — кіреберістегі фойе, одан залдар мен дәліздер тарайды.

  - id: invitation_room
    map_name: InvitationRoom
    names: {ru: Комната для приглашённых, kk: Шақырылғандар бөлмесі}
    synonyms: [комната для приглашённых, комната приглашённых, комната ожидания, зал ожидания, приглашённые,
               где подождать, күту бөлмесі, шақырылғандар бөлмесі, шақырылғандар, invitation room, waiting room]
    description:
      ru: Комната для приглашённых — здесь ожидают гости, приглашённые на заседания и встречи.
      kk: Шақырылғандар бөлмесі — отырыстар мен кездесулерге шақырылған қонақтар осында күтеді.

  - id: home
    map_name: Пункт приема
    names: {ru: Пост робота, kk: Робот орны}
    synonyms: [пост робота, пункт приёма, пункт приема, стартовая точка, робот орны]
    description:
      ru: Пост робота — стартовая точка, где робот стоит и встречает посетителей.
      kk: Робот орны — робот тұрып, келушілерді қарсы алатын бастапқы нүкте.
    service: true
