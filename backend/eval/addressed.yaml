# Eval «не мне» (v1.4, docs/api-contract.md «Шумный зал»): обращена ли реплика к роботу.
#   expect: ignore — робот должен промолчать (done с ignored: true, category not_addressed)
#   expect: answer — робот должен ответить (не ignored, есть фразы)
# Главное — ни одного ложного ignore: пропустить вопрос посетителя хуже, чем ответить лишний раз.
# Примеры из промпта (app/agent/prompts.py, правило 14) сюда не входят, кроме реплик с теста в хабе
# (source: hub-2026-10-27) — набор проверяет обобщение, а не заучивание.
cases:
