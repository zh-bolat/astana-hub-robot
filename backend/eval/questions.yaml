# Набор eval-вопросов (шаг 3.8). ЗАГОТОВКА: вопросы подобраны под базу-пример.
# Финальные 50 вопросов даёт Astana Hub; формат тот же.
#
#   id            — уникальный id
#   lang          — язык вопроса (ru/kk/en); робот передаёт его как lang, если задан pass_lang: true
#   question      — текст вопроса
#   expect_found  — должен ли быть ответ из базы (false = ожидаем отказ «обратитесь на ресепшен»)
#   expect_source — (опц.) id факта/места, который должен быть в sources
#   expect_contains — (опц.) подстроки, которые должны быть в ответе (без учёта регистра)
