# Astana Hub Robot — backend stack.
#
# Профили (COMPOSE_PROFILES в infra/.env или --profile):
#   (без профиля)  только api на 127.0.0.1:8000 — локальная разработка, SQLite
#   prod           + caddy (HTTPS по $DOMAIN, порты 80/443)
#   postgres       + postgres 16 (когда backend перейдёт с SQLite)
#
# Локально:   cd infra && docker compose up --build
# Сервер:     COMPOSE_PROFILES=prod в infra/.env → docker compose up -d
name: astana-hub-robot

services:
  api:
    build:
      context: ../backend
    # В CI образ собирается и пушится в GHCR; на сервере API_IMAGE указывает на тег.
    image: ${API_IMAGE:-astana-hub-robot-api:local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/hub.db}
    volumes:
      - api-data:/data
    # Публикуется только на localhost: снаружи доступ лишь через caddy.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}  # postgres не стартует с пустым паролем
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  api-data:
  pg-data:
  caddy-data:
  caddy-config:
